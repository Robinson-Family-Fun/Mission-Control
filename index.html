document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;var a=el.getAttribute("data-a"),v=el.getAttribute("data-v"),id=el.getAttribute("data-id");
  if(a==="bg"){if(e.target===el&&!(ui.modal&&ui.modal.kind==="checkin"))closeModal();return;}
  switch(a){

  case "cls":ui.cls=v||null;render();window.scrollTo(0,0);break;
  case "toggle":toggleItem(id);if(ui.modal)renderModal();render();break;
  case "step":toggleStep(id,el.getAttribute("data-s"));if(ui.modal)renderModal();render();break;
  case "open":openModal("item",{id:id});break;
  case "add":openModal("add",{classId:v||(ui.tab==="classes"?ui.cls:null)});break;
  case "edit":openModal("add",{edit:id});break;
  case "close":if(ui.modal&&ui.modal.data&&ui.modal.data.back){var b=ui.modal.data.back;ui.modal=b;renderModal();}else closeModal();break;
  case "f-class":grabForm();ui.modal.data.classId=v;renderModal();break;
  case "f-type":grabForm();ui.modal.data.type=v;renderModal();break;
  case "f-due":grabForm();ui.modal.data.due=v;renderModal();break;
  case "saveitem":grabForm();var d=ui.modal.data;
    if(!d.classId){toast("Pick a class first 👆");return;} if(!d.title.trim()){toast("Give it a name ✍️");return;} if(!d.due){toast("Pick a due date 📅");return;}
    if(d.edit){var it=S.items.find(function(i){return i.id===d.edit});var dueChanged=it.due!==d.due||it.type!==d.type;it.classId=d.classId;it.type=d.type;it.title=d.title.trim();it.notes=d.notes.trim();it.due=d.due;if(dueChanged)it.steps=makeSteps(it.type,it.due,it.steps);toast("Saved ✏️");}
    else{var ni={id:uid(),classId:d.classId,type:d.type,title:d.title.trim(),notes:d.notes.trim(),due:d.due,done:false,createdAt:today(),steps:makeSteps(d.type,d.due)};S.items.push(ni);award(2,"logged it!");if(ni.steps.length)toast("✨ Study plan created: "+ni.steps.length+" steps");
      if(ui.ci)ui.ci.cls[d.classId]=true;}
    save();
    if(d.back){ui.modal=d.back;renderModal();render();}else closeModal();break;
  case "delete":if(!el.dataset.sure){el.dataset.sure=1;el.textContent="Tap again to delete";return;}var di=S.items.find(function(i){return i.id===id});if(di&&di.done)S.xp=Math.max(0,S.xp-(di.xpAwarded||0));S.items=S.items.filter(function(i){return i.id!==id});save();closeModal();toast("Deleted 🗑️");break;
  case "conf":var ci2=S.items.find(function(i){return i.id===id});ci2.confidence=+v;save();renderModal();render();break;
  case "checkin":ui.ci={step:0,cls:{}};openModal("checkin");break;
  case "ci-g":ui.ci[v]=!ui.ci[v];renderModal();break;
  case "ci-next":ui.ci.step++;renderModal();break;
  case "ci-back":ui.ci.step--;renderModal();break;
  case "ci-none":ui.ci.cls[v]=true;renderModal();break;
  case "ci-add":var back=ui.modal;ui.modal={kind:"add",data:{classId:v,back:back}};renderModal();break;
  case "ci-off":S.checkins[today()]="off";save();ui.ci=null;closeModal();toast("🏖️ Enjoy the day off — streak is safe!");break;
  case "ci-done":S.checkins[today()]=true;award(20,"Daily Mission complete!");if(!overdue().length)earn("clean");confetti(200);save();ui.ci=null;closeModal();break;
  case "prac":var m=+v;S.practice[today()]=(S.practice[today()]||0)+m;award(m,"practice logged 🥁");save();render();break;
  case "pracundo":var tdm=S.practice[today()]||0;S.xp=Math.max(0,S.xp-tdm);delete S.practice[today()];save();render();break;
  case "focus":startFocus(+v);break;
  case "readtimer":startFocus(Math.max(5,S.readingGoal-readToday()),"read");window.scrollTo(0,0);break;
  case "read":var rm=+v;S.reading[today()]=(S.reading[today()]||0)+rm;award(rm,"reading logged 📖");if(readToday()>=S.readingGoal&&readToday()-rm<S.readingGoal){toast("📚 Reading goal done for today!");confetti(120);}save();render();break;
  case "readundo":var rtm=S.reading[today()]||0;S.xp=Math.max(0,S.xp-rtm);delete S.reading[today()];save();render();break;
  case "book":S.book=($("#book").value||"").trim().slice(0,80);save();toast("📚 Book saved");render();break;
  case "rgoal":S.readingGoal=Math.max(5,parseInt($("#p-rgoal").value)||20);save();toast("Reading goal saved");renderModal();break;
  case "focusstop":clearInterval(focusInt);ui.focus=null;render();if(dirty)schedulePublish(2000);break;
  case "quiz":startQuiz(id);break;
  case "qa":var qq=ui.quiz.qs[+el.getAttribute("data-q")];qq.pick=+v;if(qq.pick===qq.answer){award(3,"correct!");}
    if(ui.quiz.qs.every(function(x){return x.pick!=null})){if(ui.quiz.qs.every(function(x){return x.pick===x.answer})){earn("quiz");confetti(150);}save();}
    renderModal();break;
  case "redeem":openModal("redeem",{id:id});break;
  case "redeem-go":var r=S.rewards.find(function(x){return x.id===id});if(coins()<r.cost)return;S.spent+=r.cost;S.requests.push({id:uid(),name:r.name,cost:r.cost,at:today(),status:"pending"});save();closeModal();toast("📨 Request sent! Ask Dad or Mom to approve it.");confetti(90);break;
  case "parent":openModal("parent",{pin:""});break;
  case "pin":var pd=ui.modal.data;pd.bad=false;if(v==="⌫")pd.pin=(pd.pin||"").slice(0,-1);else if((pd.pin||"").length<4)pd.pin=(pd.pin||"")+v;
    if(pd.pin.length===4){if(!S.pin||pd.reset){S.pin=pd.pin;save();pd.ok=true;toast("🔐 PIN set");}else if(pd.pin===S.pin)pd.ok=true;else{pd.bad=true;pd.pin="";}}
    renderModal();break;
  case "newpin":ui.modal.data={pin:"",reset:true,ok:false};S.pin=null;renderModal();break;
  case "req":var rq=S.requests.find(function(x){return x.id===id});rq.status=v;if(v==="denied")S.spent-=rq.cost;save();renderModal();break;
  case "bonus":var bn=+v;S.xp=Math.max(0,S.xp+bn);if(bn>0)toast("🎁 Bonus +"+bn+" from Dad/Mom!");save();renderModal();break;
  case "rsave":document.querySelectorAll("[data-r]").forEach(function(inp){var rr=S.rewards.find(function(x){return x.id===inp.dataset.id});if(!rr)return;var f=inp.dataset.r;rr[f]=f==="cost"?Math.max(1,parseInt(inp.value)||1):inp.value.slice(0,60);});save();toast("Rewards saved");renderModal();break;
  case "radd":document.querySelectorAll("[data-r]").forEach(function(inp){var rr=S.rewards.find(function(x){return x.id===inp.dataset.id});if(rr){var f=inp.dataset.r;rr[f]=f==="cost"?Math.max(1,parseInt(inp.value)||1):inp.value.slice(0,60);}});S.rewards.push({id:uid(),name:"New reward",cost:100,emoji:"🎁"});save();renderModal();break;
  case "rdel":S.rewards=S.rewards.filter(function(x){return x.id!==id});save();renderModal();break;
  case "goal":S.practiceGoal=Math.max(10,parseInt($("#p-goal").value)||90);save();toast("Goal saved");renderModal();break;
  case "markoff":S.checkins[today()]="off";save();toast("Today marked as no school");renderModal();break;
  case "backup":S.lastBackup=today();save();var code=JSON.stringify(S);try{navigator.clipboard.writeText(code).then(function(){toast("📋 Backup copied — paste it into Notes or an email to yourself")},function(){showCode(code)})}catch(err){showCode(code)}break;
  case "restore":try{var o=JSON.parse($("#p-restore").value);if(!o||!Array.isArray(o.items)||!o.classes)throw 0;var keepPin=S.pin;S=o;if(!S.pin)S.pin=keepPin;save();toast("✅ Restored");closeModal();}catch(err){toast("That backup code didn't work")}break;
  }});
function showCode(code){var ta=$("#p-restore");if(ta){ta.value=code;ta.select();toast("Select-all and copy the code in the box");}}

/* ---------- toast + confetti ---------- */
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toasts").appendChild(t);setTimeout(function(){t.style.transition="opacity .4s";t.style.opacity=0;setTimeout(function(){t.remove()},450)},2600);}
var cv=document.getElementById("confetti"),cx=cv.getContext("2d"),parts=[],raf=null;
function confetti(n){var W=cv.width=innerWidth,H=cv.height=innerHeight;var cols=["#ffd23f","#4cc9f0","#3ddc97","#ff5c7a","#b48cff","#ff8a3d"];
  for(var i=0;i<n;i++)parts.push({x:W/2+(Math.random()-.5)*W*.4,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:0});
  if(!raf)tick();}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(function(p){return p.life<160&&p.y<cv.height+20});
  parts.forEach(function(p){p.life++;p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.15;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,cv.width,cv.height),null);}

/* ---------- boot ---------- */
checkBadges();render();
setInterval(function(){if(!ui.modal&&!(ui.focus&&ui.focus.running))render();},60000);
syncMode="local";setTimeout(renderSync,0);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
</script></body></html>
